<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12381F">
<title>إجازة التغاريد | Ijaza Chants</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{--g:#12381F;--g2:#1c5030;--gold:#E8B923;--ink:#f4f1e6;--mut:#a9c0ae}
*{box-sizing:border-box}
body{margin:0;background:var(--g);color:var(--ink);font:17px/1.7 'Noto Naskh Arabic',serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,button,.tab{font-family:'Reem Kufi',sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:2px solid var(--gold)}
header img{width:52px;height:52px;border-radius:50%}
header h1{margin:0;font-size:1.3rem;color:var(--gold);flex:1}
main{max-width:720px;margin:auto;padding:16px}
nav{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;padding:10px;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:8px;font-size:1rem;cursor:pointer}
.tab.on{background:var(--gold);color:var(--g)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.item{background:var(--g2);border-inline-start:4px solid var(--gold);padding:12px 14px;margin-bottom:10px;border-radius:6px}
.item b{color:var(--gold)}.item small{color:var(--mut)}
audio{width:100%;margin-top:8px}
form{display:grid;gap:8px;background:var(--g2);padding:14px;border-radius:8px;margin-bottom:16px}
input{padding:10px;border-radius:6px;border:1px solid var(--mut);background:var(--g);color:var(--ink);font:inherit}
.go,.sm{background:var(--gold);color:var(--g);border:0;border-radius:8px;padding:10px 16px;font-size:1rem;cursor:pointer}
.sm{padding:6px 10px;font-size:.85rem}
#msg{color:var(--gold);min-height:1.5em}
.hide{display:none}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Ijaza Chants">
  <h1 id="t_title"></h1>
  <button class="sm" id="lang"></button>
  <button class="sm" id="out"></button>
</header>
<main>
  <p id="msg" role="status"></p>

  <section id="authBox">
    <form id="authForm">
      <input id="email" type="email" required autocomplete="email">
      <input id="pass" type="password" required minlength="6" autocomplete="current-password">
      <button class="go" id="login" type="submit"></button>
      <button class="sm" id="signup" type="button"></button>
    </form>
  </section>

  <section id="app">
    <nav>
      <button class="tab on" data-v="lib" id="t_lib"></button>
      <button class="tab" data-v="mkt" id="t_mkt"></button>
    </nav>

    <div id="lib">
      <form id="recForm">
        <input id="r_owner" required>
        <input id="r_bird">
        <input id="r_ring">
        <input id="r_region">
        <input id="r_file" type="file" accept="audio/*" required>
        <button class="go" id="r_btn" type="submit"></button>
      </form>
      <div id="recList"></div>
    </div>

    <div id="mkt" class="hide">
      <p id="t_rule" style="color:var(--mut)"></p>
      <form id="lisForm">
        <input id="l_title" required>
        <input id="l_ring" required>
        <input id="l_price" type="number" min="0">
        <input id="l_wilaya">
        <input id="l_phone" type="tel">
        <button class="go" id="l_btn" type="submit"></button>
      </form>
      <div id="lisList"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// 1) Paste your keys from Supabase > Project Settings > API
const SUPABASE_URL = "https://vccqpwybcxkihhtvfuuk.supabase.co";
const SUPABASE_KEY = "sb_publishable_5UcDQKTVAuPuV_wgthY-Gg_GCNehM7I";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const T = {
 ar:{title:"إجازة التغاريد",email:"البريد الإلكتروني",pass:"كلمة السر",login:"تسجيل الدخول",signup:"إنشاء حساب",out:"خروج",lib:"مكتبة التغاريد",mkt:"بيع وشراء",
  owner:"اسم المربّي",bird:"اسم العصفور",ring:"رقم الحلقة",ringReq:"رقم الحلقة (إلزامي)",region:"المنطقة",addRec:"نشر التغريدة",
  ltitle:"عنوان الإعلان",price:"السعر (دج)",wilaya:"الولاية",phone:"رقم الهاتف",addLis:"نشر الإعلان",
  rule:"تُعرض في السوق الطيور المحجَّلة المُربّاة في الأسر فقط.",empty:"لا شيء بعدُ. كن أول من ينشر.",
  ok:"تم النشر",checkMail:"تحقق من بريدك لتأكيد الحساب",approved:"معتمدة",call:"اتصال"},
 fr:{title:"Ijaza Chants",email:"E-mail",pass:"Mot de passe",login:"Se connecter",signup:"Créer un compte",out:"Quitter",lib:"Bibliothèque",mkt:"Marché",
  owner:"Nom de l'éleveur",bird:"Nom de l'oiseau",ring:"N° de bague",ringReq:"N° de bague (obligatoire)",region:"Région",addRec:"Publier le chant",
  ltitle:"Titre de l'annonce",price:"Prix (DA)",wilaya:"Wilaya",phone:"Téléphone",addLis:"Publier l'annonce",
  rule:"Seuls les oiseaux bagués nés en captivité sont acceptés.",empty:"Rien pour l'instant. Soyez le premier.",
  ok:"Publié",checkMail:"Vérifiez votre e-mail pour confirmer le compte",approved:"Certifié",call:"Appeler"},
 en:{title:"Ijaza Chants",email:"Email",pass:"Password",login:"Log in",signup:"Create account",out:"Log out",lib:"Song library",mkt:"Market",
  owner:"Breeder name",bird:"Bird name",ring:"Ring number",ringReq:"Ring number (required)",region:"Region",addRec:"Publish song",
  ltitle:"Listing title",price:"Price (DZD)",wilaya:"Wilaya",phone:"Phone",addLis:"Publish listing",
  rule:"Only ringed, captive-bred birds are listed.",empty:"Nothing yet. Be the first.",
  ok:"Published",checkMail:"Check your email to confirm the account",approved:"Certified",call:"Call"}
};
const order=["ar","fr","en"];
let L=localStorage.getItem("lang")||"ar", user=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say=m=>{$("msg").textContent=m||""};

function applyLang(){
  const t=T[L];
  document.documentElement.lang=L; document.documentElement.dir=L==="ar"?"rtl":"ltr";
  document.body.style.fontFamily=L==="ar"?"":"system-ui,sans-serif";
  $("t_title").textContent=t.title; $("lang").textContent=order[(order.indexOf(L)+1)%3].toUpperCase();
  $("out").textContent=t.out; $("login").textContent=t.login; $("signup").textContent=t.signup;
  $("email").placeholder=t.email; $("pass").placeholder=t.pass;
  $("t_lib").textContent=t.lib; $("t_mkt").textContent=t.mkt; $("t_rule").textContent=t.rule;
  [["r_owner","owner"],["r_bird","bird"],["r_ring","ring"],["r_region","region"],
   ["l_title","ltitle"],["l_ring","ringReq"],["l_price","price"],["l_wilaya","wilaya"],["l_phone","phone"]]
   .forEach(([i,k])=>$(i).placeholder=t[k]);
  $("r_btn").textContent=t.addRec; $("l_btn").textContent=t.addLis;
  loadRec();loadLis();
}
$("lang").onclick=()=>{L=order[(order.indexOf(L)+1)%3];localStorage.setItem("lang",L);applyLang()};

function show(){
  $("authBox").classList.toggle("hide",!!user);
  $("recForm").classList.toggle("hide",!user);
  $("lisForm").classList.toggle("hide",!user);
  $("out").classList.toggle("hide",!user);
}
async function init(){
  const {data}=await db.auth.getSession(); user=data.session?.user||null; show(); applyLang();
  db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;show();say("");loadRec();loadLis()});
}
$("authForm").onsubmit=async e=>{
  e.preventDefault(); say("");
  const {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("pass").value});
  if(error) say(error.message);
};
$("signup").onclick=async()=>{
  say("");
  const {error}=await db.auth.signUp({email:$("email").value,password:$("pass").value});
  say(error?error.message:T[L].checkMail);
};
$("out").onclick=()=>db.auth.signOut();

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  $("lib").classList.toggle("hide",b.dataset.v!=="lib");
  $("mkt").classList.toggle("hide",b.dataset.v!=="mkt");
});

async function loadRec(){
  const {data,error}=await db.from("recordings").select("*").order("created_at",{ascending:false}).limit(50);
  if(error) return say(error.message);
  $("recList").innerHTML=data.length?data.map(r=>`<div class="item"><b>${esc(r.owner_name)}</b>
   ${r.approved?` ✔ <small>${T[L].approved}</small>`:""}<br>
   <small>${esc(r.bird_name)} ${r.ring_no?"· #"+esc(r.ring_no):""} ${r.region?"· "+esc(r.region):""}</small>
   <audio controls preload="none" src="${esc(r.audio_url)}"></audio></div>`).join(""):`<p>${T[L].empty}</p>`;
}
$("recForm").onsubmit=async e=>{
  e.preventDefault(); say("…");
  const f=$("r_file").files[0], path=`${user.id}/${Date.now()}-${f.name.replace(/[^\w.]/g,"_")}`;
  const up=await db.storage.from("audio").upload(path,f);
  if(up.error) return say(up.error.message);
  const url=db.storage.from("audio").getPublicUrl(path).data.publicUrl;
  const {error}=await db.from("recordings").insert({owner_name:$("r_owner").value,bird_name:$("r_bird").value,
    ring_no:$("r_ring").value,region:$("r_region").value,audio_url:url});
  if(error) return say(error.message);
  e.target.reset(); say(T[L].ok); loadRec();
};

async function loadLis(){
  const {data,error}=await db.from("listings").select("*").order("created_at",{ascending:false}).limit(50);
  if(error) return say(error.message);
  $("lisList").innerHTML=data.length?data.map(l=>`<div class="item"><b>${esc(l.title)}</b><br>
   <small>#${esc(l.ring_no)} · ${l.price?esc(l.price)+" · ":""}${esc(l.wilaya)}</small><br>
   ${l.phone?`<a class="sm" style="display:inline-block;margin-top:6px;text-decoration:none" href="tel:${esc(l.phone)}">${T[L].call}</a>`:""}</div>`).join(""):`<p>${T[L].empty}</p>`;
}
$("lisForm").onsubmit=async e=>{
  e.preventDefault();
  const {error}=await db.from("listings").insert({title:$("l_title").value,ring_no:$("l_ring").value,price:$("l_price").value||null,
    wilaya:$("l_wilaya").value,phone:$("l_phone").value});
  if(error) return say(error.message);
  e.target.reset(); say(T[L].ok); loadLis();
};
init();
</script>
</body>
</html>
